<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QUẢN LÍ HỌC SINH</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#172033;
      --muted:#667085;
      --line:#e5e7eb;
      --primary:#2563eb;
      --primary-soft:#eff6ff;
      --nav:#111827;
      --nav-hover:#263247;
      --ok-bg:#e8f7ed;
      --ok:#166534;
      --warn-bg:#fff7d6;
      --warn:#854d0e;
      --err-bg:#ffe8e8;
      --err:#b42318;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    button,select{font:inherit}
    button{cursor:pointer}
    .hide{display:none!important}

    /* LOGIN */
    .login-wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .login-card{
      width:100%;
      max-width:520px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:22px;
      padding:30px;
      box-shadow:0 18px 50px rgba(16,24,40,.08);
    }

    .login-card h1{
      margin:0 0 8px;
      font-size:28px;
    }

    .login-card p{
      color:var(--muted);
      line-height:1.6;
    }

    .primary{
      border:0;
      background:var(--primary);
      color:#fff;
      padding:12px 16px;
      border-radius:10px;
      font-weight:700;
    }

    .ghost{
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      padding:9px 12px;
      border-radius:9px;
    }

    /* APP */
    .app{
      min-height:100vh;
    }

    .topbar{
      height:68px;
      background:#fff;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:0 22px;
      position:sticky;
      top:0;
      z-index:30;
    }

    .brand-title{
      font-size:18px;
      font-weight:800;
    }

    .brand-sub{
      font-size:12px;
      color:var(--muted);
      margin-top:3px;
    }

    .account{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .account-email{
      font-size:13px;
      color:var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      max-width:260px;
    }

    .layout{
      min-height:calc(100vh - 68px);
      display:grid;
      grid-template-columns:245px minmax(0,1fr);
    }

    .sidebar{
      background:var(--nav);
      padding:16px 12px;
    }

    .nav-button{
      display:block;
      width:100%;
      border:0;
      background:transparent;
      color:#e5e7eb;
      text-align:left;
      padding:12px 13px;
      margin:3px 0;
      border-radius:10px;
      font-weight:600;
    }

    .nav-button:hover,
    .nav-button.active{
      background:var(--nav-hover);
      color:#fff;
    }

    .main{
      min-width:0;
      padding:22px;
    }

    .status{
      border-radius:11px;
      padding:11px 13px;
      background:var(--warn-bg);
      color:var(--warn);
      margin-bottom:14px;
      font-size:14px;
    }

    .status.ok{
      background:var(--ok-bg);
      color:var(--ok);
    }

    .status.err{
      background:var(--err-bg);
      color:var(--err);
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:18px;
      margin-bottom:16px;
      box-shadow:0 3px 14px rgba(16,24,40,.025);
    }

    .card h2,
    .card h3{
      margin-top:0;
    }

    .toolbar{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:end;
    }

    .field{
      min-width:220px;
      flex:1;
    }

    .field label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
      font-weight:700;
    }

    select{
      width:100%;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      padding:10px 11px;
      border-radius:10px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
    }

    .metric{
      border:1px solid var(--line);
      border-radius:13px;
      padding:15px;
      background:#fff;
    }

    .metric-label{
      color:var(--muted);
      font-size:13px;
    }

    .metric-value{
      font-size:25px;
      font-weight:800;
      margin-top:7px;
      word-break:break-word;
    }

    .metric-value.small{
      font-size:17px;
      line-height:1.35;
    }

    .muted{
      color:var(--muted);
    }

    .student-row{
      padding:13px 0;
      border-top:1px solid var(--line);
    }

    .student-row:first-child{
      border-top:0;
    }

    .student-name{
      font-weight:800;
      margin-bottom:4px;
    }

    .student-meta{
      color:var(--muted);
      font-size:13px;
      margin-top:3px;
    }

    .badge{
      display:inline-block;
      background:var(--primary-soft);
      color:#1d4ed8;
      border-radius:999px;
      padding:5px 9px;
      font-size:12px;
      font-weight:700;
    }

    .empty{
      padding:28px 8px;
      text-align:center;
      color:var(--muted);
    }

    .section-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }

    .section-title h2{
      margin:0;
    }

    @media(max-width:820px){
      .layout{
        grid-template-columns:1fr;
      }

      .sidebar{
        display:flex;
        overflow:auto;
        padding:8px;
        position:sticky;
        top:68px;
        z-index:20;
      }

      .nav-button{
        width:auto;
        min-width:max-content;
        margin:0 3px;
      }

      .main{
        padding:14px;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .account-email{
        display:none;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginView" class="login-wrap">
    <div class="login-card">
      <h1>QUẢN LÍ HỌC SINH</h1>
      <p>
        Đăng nhập bằng tài khoản Google đã được cấp quyền
        để truy cập hệ thống.
      </p>

      <div id="loginStatus" class="status">
        Đang kiểm tra phiên đăng nhập…
      </div>

      <button id="loginBtn" class="primary hide">
        Đăng nhập bằng Google
      </button>
    </div>
  </section>

  <!-- MASTER APP -->
  <section id="appView" class="app hide">

    <header class="topbar">
      <div>
        <div id="appTitle" class="brand-title">
          QUẢN LÍ HỌC SINH
        </div>
        <div class="brand-sub">
          B5.1 · Frontend Master
        </div>
      </div>

      <div class="account">
        <span id="accountEmail" class="account-email"></span>
        <button id="logoutBtn" class="ghost">Đăng xuất</button>
      </div>
    </header>

    <div class="layout">

      <aside id="sidebar" class="sidebar"></aside>

      <main class="main">

        <div id="appStatus" class="status">
          Đang tải dữ liệu…
        </div>

        <!-- CENTRAL CONTEXT -->
        <section class="card">
          <div class="toolbar">

            <div class="field">
              <label>LỚP / NGỮ CẢNH</label>
              <select id="contextSelect"></select>
            </div>

            <div class="field">
              <label>HỌC KỲ</label>
              <select id="semesterSelect"></select>
            </div>

          </div>
        </section>

        <section id="content"></section>

      </main>

    </div>
  </section>

<script>
/* =========================================================
   B5.1 FRONTEND MASTER
   Google Login -> Session -> v4_bootstrap_lite()
   -> Role -> Shell -> Context/HK -> Lazy Load
   ========================================================= */


/* ========================
   SUPABASE
   ======================== */

const SUPABASE_URL =
  'https://woqspbwuqfdzkkiyibcm.supabase.co';

const SUPABASE_KEY =
  'sb_publishable__fH3y7TIDu7vixpRo5DlYQ_sxHKlhZl';

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ========================
   HELPERS
   ======================== */

const $ = id => document.getElementById(id);

function escapeHtml(value){
  return String(value ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    })[c]
  );
}

function setLoginStatus(text,type=''){
  $('loginStatus').textContent = text;
  $('loginStatus').className =
    'status' + (type ? ' ' + type : '');
}

function setAppStatus(text,type=''){
  $('appStatus').textContent = text;
  $('appStatus').className =
    'status' + (type ? ' ' + type : '');
}

async function rpc(name,args={}){
  const {data,error} = await db.rpc(name,args);

  if(error){
    throw error;
  }

  return data;
}


/* ========================
   NAVIGATION
   ======================== */

const NAVIGATION = {

  teacher:[
    'Tổng quan',
    'Lớp học',
    'Học sinh',
    'Điểm rèn luyện',
    'BXH',
    'Điểm học tập',
    'EduFlow',
    'Tài khoản HS',
    'Cấu hình'
  ],

  student:[
    'Trang chủ',
    'Hồ sơ',
    'Điểm',
    'BXH',
    'Chức vụ',
    'Nghề nghiệp',
    'Học tập',
    'Kết quả',
    'Trao đổi/Thông báo'
  ]

};


/* ========================
   CENTRAL STATE
   ======================== */

const APP = {

  session:null,

  role:null,

  bootstrap:null,

  contexts:[],

  semesters:[],

  contextId:null,

  semesterId:null,

  currentPage:null

};


/* ========================
   AUTH
   ======================== */

async function googleLogin(){

  setLoginStatus(
    'Đang chuyển tới Google để đăng nhập…'
  );

  const {error} =
    await db.auth.signInWithOAuth({

      provider:'google',

      options:{
        redirectTo:
          location.origin + location.pathname
      }

    });

  if(error){
    setLoginStatus(
      'Không thể đăng nhập: ' + error.message,
      'err'
    );
  }
}


async function logout(){

  await db.auth.signOut();

  location.reload();
}


/* ========================
   BOOTSTRAP NORMALIZATION
   ======================== */

function collectStudentContexts(data){

  const result = [];

  const memberships =
    Array.isArray(data.memberships)
      ? data.memberships
      : [];

  for(const membership of memberships){

    const contexts =
      Array.isArray(membership.contexts)
        ? membership.contexts
        : [];

    for(const context of contexts){

      result.push({

        ...context,

        membership_id:
          membership.membership_id,

        class_id:
          membership.class_id,

        class_name:
          membership.class_name,

        class_code:
          membership.class_code,

        school_year:
          membership.school_year

      });

    }
  }

  return result;
}


function collectTeacherContexts(data){

  const result = [];

  const classes =
    Array.isArray(data.classes)
      ? data.classes
      : [];

  for(const cls of classes){

    const contexts =
      Array.isArray(cls.contexts)
        ? cls.contexts
        : [];

    for(const context of contexts){

      result.push({

        ...context,

        class_id:
          cls.class_id,

        class_name:
          cls.class_name,

        class_code:
          cls.class_code,

        school_year:
          cls.school_year

      });

    }
  }

  return result;
}


function contextLabel(context){

  if(!context){
    return 'Chưa có ngữ cảnh';
  }

  const type =
    context.context_type === 'HOMEROOM'
      ? 'Chủ nhiệm'
      : 'Bộ môn';

  const subject =
    context.subject_name
      ? ' · ' + context.subject_name
      : '';

  return (
    (context.class_name || 'Lớp')
    + ' · '
    + type
    + subject
  );
}


function semesterLabel(semester){

  if(!semester){
    return '';
  }

  return (
    (semester.semester_code || '')
    +
    (
      semester.school_year
        ? ' · ' + semester.school_year
        : ''
    )
  );
}


/* ========================
   START APPLICATION
   ======================== */

async function startApplication(session){

  APP.session = session || null;

  if(!session){

    $('appView').classList.add('hide');

    $('loginView').classList.remove('hide');

    $('loginBtn').classList.remove('hide');

    setLoginStatus(
      'Chưa đăng nhập.'
    );

    return;
  }


  $('loginBtn').classList.add('hide');

  setLoginStatus(
    'Đã xác thực Google. Đang tải dữ liệu tài khoản…'
  );


  try{

    /*
      B5.1:
      Không đọc trực tiếp user_roles/students.
      Role + bootstrap đi qua backend contract.
    */

    const bootstrap =
      await rpc('v4_bootstrap_lite');


    if(!bootstrap){
      throw new Error(
        'Bootstrap không trả về dữ liệu.'
      );
    }


    APP.bootstrap = bootstrap;


    const identity =
      bootstrap.identity || {};


    const data =
      bootstrap.data || {};


    APP.role =
      String(identity.role || '')
        .toLowerCase();


    if(
      APP.role !== 'teacher'
      &&
      APP.role !== 'student'
    ){
      throw new Error(
        'Tài khoản chưa có vai trò hợp lệ.'
      );
    }


    APP.semesters =
      Array.isArray(data.semesters)
        ? data.semesters
        : [];


    APP.contexts =
      APP.role === 'teacher'
        ? collectTeacherContexts(data)
        : collectStudentContexts(data);


    /*
      Không hard-code context.
      Lấy context đầu tiên backend cấp quyền.
    */

    APP.contextId =
      APP.contexts.length
        ? APP.contexts[0].context_id
        : null;


    /*
      Ưu tiên semester active.
      Nếu backend chưa đánh active,
      dùng semester đầu tiên được cấp.
    */

    const activeSemester =
      APP.semesters.find(
        semester => semester.is_active
      )
      ||
      APP.semesters[0]
      ||
      null;


    APP.semesterId =
      activeSemester
        ? activeSemester.semester_id
        : null;


    APP.currentPage =
      NAVIGATION[APP.role][0];


    renderShell();


    await renderCurrentPage();

  }
  catch(error){

    console.error(error);

    $('appView').classList.add('hide');

    $('loginView').classList.remove('hide');

    setLoginStatus(
      'Không thể mở ứng dụng: '
      + error.message,
      'err'
    );

  }
}


/* ========================
   SHELL
   ======================== */

function renderShell(){

  $('loginView').classList.add('hide');

  $('appView').classList.remove('hide');


  $('accountEmail').textContent =
    APP.session?.user?.email || '';


  $('appTitle').textContent =
    APP.role === 'teacher'
      ? 'QUẢN LÍ HỌC SINH'
      : 'CỔNG HỌC SINH';


  renderNavigation();

  renderContextSelector();

  renderSemesterSelector();
}


function renderNavigation(){

  const items =
    NAVIGATION[APP.role] || [];


  $('sidebar').innerHTML =
    items.map(item => `

      <button
        class="nav-button
        ${item === APP.currentPage ? 'active' : ''}"
        data-page="${escapeHtml(item)}"
      >
        ${escapeHtml(item)}
      </button>

    `).join('');


  $('sidebar')
    .querySelectorAll('.nav-button')
    .forEach(button => {

      button.onclick = async () => {

        APP.currentPage =
          button.dataset.page;

        renderNavigation();

        await renderCurrentPage();

      };

    });
}


function renderContextSelector(){

  const select =
    $('contextSelect');


  if(!APP.contexts.length){

    select.innerHTML =
      '<option value="">Chưa có lớp/ngữ cảnh</option>';

    select.disabled = true;

    return;
  }


  select.disabled = false;


  select.innerHTML =
    APP.contexts.map(context => `

      <option
        value="${escapeHtml(context.context_id)}"
        ${
          String(context.context_id)
          ===
          String(APP.contextId)
            ? 'selected'
            : ''
        }
      >
        ${escapeHtml(contextLabel(context))}
      </option>

    `).join('');


  select.onchange = async event => {

    APP.contextId =
      event.target.value || null;

    await renderCurrentPage();

  };
}


function renderSemesterSelector(){

  const select =
    $('semesterSelect');


  if(!APP.semesters.length){

    select.innerHTML =
      '<option value="">Chưa có học kỳ</option>';

    select.disabled = true;

    return;
  }


  select.disabled = false;


  select.innerHTML =
    APP.semesters.map(semester => `

      <option
        value="${escapeHtml(semester.semester_id)}"
        ${
          String(semester.semester_id)
          ===
          String(APP.semesterId)
            ? 'selected'
            : ''
        }
      >
        ${escapeHtml(
          semesterLabel(semester)
        )}
      </option>

    `).join('');


  select.onchange = async event => {

    APP.semesterId =
      event.target.value || null;

    await renderCurrentPage();

  };
}


/* ========================
   CURRENT CONTEXT
   ======================== */

function getCurrentContext(){

  return APP.contexts.find(
    context =>
      String(context.context_id)
      ===
      String(APP.contextId)
  ) || null;
}


function getCurrentSemester(){

  return APP.semesters.find(
    semester =>
      String(semester.semester_id)
      ===
      String(APP.semesterId)
  ) || null;
}


/* ========================
   LAZY LOAD ROUTER
   ======================== */

async function renderCurrentPage(){

  const context =
    getCurrentContext();


  const semester =
    getCurrentSemester();


  if(!context || !semester){

    $('content').innerHTML = `

      <section class="card">
        <div class="empty">
          Tài khoản hiện chưa có
          lớp/ngữ cảnh hoặc học kỳ khả dụng.
        </div>
      </section>

    `;

    setAppStatus(
      'Bootstrap đã hoàn tất.',
      'ok'
    );

    return;
  }


  setAppStatus(
    'Đang tải ' + APP.currentPage + '…'
  );


  try{

    if(APP.role === 'teacher'){

      await renderTeacherPage(
        context,
        semester
      );

    }
    else{

      await renderStudentPage(
        context,
        semester
      );

    }


    setAppStatus(
      'Đã tải '
      + APP.currentPage
      + ' · '
      + contextLabel(context)
      + ' · '
      + semesterLabel(semester),
      'ok'
    );

  }
  catch(error){

    console.error(error);

    $('content').innerHTML = `

      <section class="card">
        <div class="empty">
          Không thể tải dữ liệu của mục này.
        </div>
      </section>

    `;


    setAppStatus(
      error.message,
      'err'
    );

  }
}


/* ========================
   TEACHER B5.1
   ======================== */

async function renderTeacherPage(
  context,
  semester
){

  /*
    B5.1 chỉ nối dữ liệu thật cho
    shell/overview/roster cơ bản.

    Chưa phát triển mutation điểm,
    Game Engine, Gradebook, EduFlow...
  */


  const livePages = [
    'Tổng quan',
    'Lớp học',
    'Học sinh'
  ];


  if(!livePages.includes(APP.currentPage)){

    renderFutureModule(
      APP.currentPage,
      context,
      semester
    );

    return;
  }


  const roster =
    await rpc(
      'v4_teacher_context_students',
      {
        p_context_id:
          context.context_id,

        p_semester_id:
          semester.semester_id
      }
    );


  const students =
    Array.isArray(roster)
      ? roster
      : [];


  if(APP.currentPage === 'Tổng quan'){

    $('content').innerHTML = `

      <section class="card">

        <div class="section-title">
          <h2>Tổng quan</h2>
          <span class="badge">
            ${escapeHtml(
              semester.semester_code
            )}
          </span>
        </div>

        <p class="muted">
          ${escapeHtml(
            contextLabel(context)
          )}
        </p>

        <div class="grid">

          <div class="metric">
            <div class="metric-label">
              Học sinh
            </div>
            <div class="metric-value">
              ${students.length}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">
              Loại lớp
            </div>
            <div class="metric-value small">
              ${
                context.context_type
                === 'HOMEROOM'
                  ? 'Lớp chủ nhiệm'
                  : 'Lớp bộ môn'
              }
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">
              Học kỳ
            </div>
            <div class="metric-value">
              ${escapeHtml(
                semester.semester_code
              )}
            </div>
          </div>

        </div>

      </section>

      <section class="card">

        <h3>Học sinh trong lớp</h3>

        ${renderStudentRows(students)}

      </section>

    `;

    return;
  }


  if(APP.currentPage === 'Lớp học'){

    $('content').innerHTML = `

      <section class="card">

        <h2>Lớp học</h2>

        <p>
          <b>Lớp:</b>
          ${escapeHtml(
            context.class_name || ''
          )}
        </p>

        <p>
          <b>Ngữ cảnh:</b>
          ${
            context.context_type
            === 'HOMEROOM'
              ? 'Chủ nhiệm'
              : 'Bộ môn'
          }
        </p>

        ${
          context.subject_name
            ? `
              <p>
                <b>Môn học:</b>
                ${escapeHtml(
                  context.subject_name
                )}
              </p>
            `
            : ''
        }

        <p>
          <b>Năm học:</b>
          ${escapeHtml(
            context.school_year || ''
          )}
        </p>

        <p>
          <b>Số học sinh:</b>
          ${students.length}
        </p>

      </section>

    `;

    return;
  }


  $('content').innerHTML = `

    <section class="card">

      <div class="section-title">
        <h2>Học sinh</h2>

        <span class="badge">
          ${students.length} học sinh
        </span>
      </div>

      ${renderStudentRows(students)}

    </section>

  `;
}


function renderStudentRows(students){

  if(!students.length){

    return `
      <div class="empty">
        Lớp hiện chưa có học sinh.
      </div>
    `;
  }


  return students.map(student => {

    const name =
      student.full_name
      ||
      student.student_name
      ||
      'Học sinh';


    return `

      <div class="student-row">

        <div class="student-name">
          ${escapeHtml(name)}
        </div>

        ${
          student.email
            ? `
              <div class="student-meta">
                ${escapeHtml(
                  student.email
                )}
              </div>
            `
            : ''
        }

        <div class="student-meta">
          ${
            student.points !== undefined
              ? escapeHtml(
                  student.points
                ) + ' điểm'
              : ''
          }

          ${
            student.band !== undefined
              &&
            student.band !== null
              ? ' · Band '
                + escapeHtml(
                    student.band
                  )
              : ''
          }
        </div>

      </div>

    `;

  }).join('');
}


/* ========================
   STUDENT B5.1
   ======================== */

async function renderStudentPage(
  context,
  semester
){

  const livePages = [
    'Trang chủ',
    'Hồ sơ',
    'Điểm',
    'Chức vụ',
    'Nghề nghiệp'
  ];


  if(!livePages.includes(APP.currentPage)){

    renderFutureModule(
      APP.currentPage,
      context,
      semester
    );

    return;
  }


  /*
    membership_id đến từ bootstrap.
    Không hard-code student/membership.
  */

  if(!context.membership_id){

    throw new Error(
      'Bootstrap thiếu membership của học sinh.'
    );
  }


  const summary =
    await rpc(
      'v4_student_context_summary',
      {
        p_membership_id:
          context.membership_id,

        p_context_id:
          context.context_id,

        p_semester_id:
          semester.semester_id
      }
    );


  if(!summary){

    throw new Error(
      'Không nhận được hồ sơ học sinh.'
    );
  }


  if(APP.currentPage === 'Trang chủ'){

    $('content').innerHTML = `

      <section class="card">

        <div class="section-title">

          <h2>
            ${escapeHtml(
              summary.student_name
              || 'Học sinh'
            )}
          </h2>

          <span class="badge">
            ${escapeHtml(
              semester.semester_code
            )}
          </span>

        </div>

        <p class="muted">
          ${escapeHtml(
            contextLabel(context)
          )}
        </p>

        <div class="grid">

          <div class="metric">
            <div class="metric-label">
              Điểm hiện tại
            </div>
            <div class="metric-value">
              ${escapeHtml(
                summary.points ?? 0
              )}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">
              Band
            </div>
            <div class="metric-value">
              ${escapeHtml(
                summary.band ?? '—'
              )}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">
              Chức vụ hiện tại
            </div>
            <div class="metric-value small">
              ${escapeHtml(
                summary.role?.display_name
                || 'Chưa có'
              )}
            </div>
          </div>

        </div>

      </section>

      <section class="card">

        <h3>Nghề nghiệp</h3>

        <p>
          ${
            escapeHtml(
              summary.career?.display_name
              || 'Chưa chọn'
            )
          }
        </p>

      </section>

    `;

    return;
  }


  if(APP.currentPage === 'Hồ sơ'){

    $('content').innerHTML = `

      <section class="card">

        <h2>Hồ sơ</h2>

        <p>
          <b>Họ tên:</b>
          ${escapeHtml(
            summary.student_name || ''
          )}
        </p>

        <p>
          <b>Giới tính:</b>
          ${escapeHtml(
            summary.gender || ''
          )}
        </p>

        <p>
          <b>Lớp:</b>
          ${escapeHtml(
            summary.class_name
            || context.class_name
            || ''
          )}
        </p>

        <p>
          <b>Học kỳ:</b>
          ${escapeHtml(
            summary.semester_code
            || semester.semester_code
            || ''
          )}
        </p>

      </section>

    `;

    return;
  }


  if(APP.currentPage === 'Điểm'){

    $('content').innerHTML = `

      <section class="card">

        <h2>Điểm</h2>

        <div class="grid">

          <div class="metric">

            <div class="metric-label">
              Điểm hiện tại
            </div>

            <div class="metric-value">
              ${escapeHtml(
                summary.points ?? 0
              )}
            </div>

          </div>

          <div class="metric">

            <div class="metric-label">
              Band hiện tại
            </div>

            <div class="metric-value">
              ${escapeHtml(
                summary.band ?? '—'
              )}
            </div>

          </div>

          <div class="metric">

            <div class="metric-label">
              Học kỳ
            </div>

            <div class="metric-value">
              ${escapeHtml(
                semester.semester_code
              )}
            </div>

          </div>

        </div>

        <p class="muted">
          Lịch sử giao dịch điểm sẽ được nối
          ở bước frontend tiếp theo.
        </p>

      </section>

    `;

    return;
  }


  if(APP.currentPage === 'Chức vụ'){

    $('content').innerHTML = `

      <section class="card">

        <h2>Chức vụ</h2>

        <div class="metric">

          <div class="metric-label">
            Chức vụ hiện tại
          </div>

          <div class="metric-value small">
            ${escapeHtml(
              summary.role?.display_name
              || 'Chưa có'
            )}
          </div>

        </div>

        <p class="muted">
          B5.1 chỉ hiển thị chức vụ hiện tại
          do backend cung cấp.
        </p>

      </section>

    `;

    return;
  }


  $('content').innerHTML = `

    <section class="card">

      <h2>Nghề nghiệp</h2>

      <div class="metric">

        <div class="metric-label">
          Nghề nghiệp hiện tại
        </div>

        <div class="metric-value small">
          ${escapeHtml(
            summary.career?.display_name
            || 'Chưa chọn'
          )}
        </div>

      </div>

      <p class="muted">
        B5.1 chưa mở thao tác chọn hoặc
        thay đổi nghề nghiệp.
      </p>

    </section>

  `;
}

/* ========================
   EVENTS
   ======================== */

$('loginBtn').onclick =
  googleLogin;


$('logoutBtn').onclick =
  logout;


/*
  Giữ cơ chế Auth listener.
  B5.1 chưa đăng ký Realtime data channel mới.
  Realtime scoped sẽ được nối khi module
  mutation/read tương ứng được hoàn thiện.
*/

db.auth.onAuthStateChange(
  (event,session) => {

    if(
      event === 'SIGNED_IN'
      ||
      event === 'SIGNED_OUT'
    ){
      startApplication(session);
    }

  }
);


/* ========================
   INITIAL SESSION
   ======================== */

(async function init(){

  const {data,error} =
    await db.auth.getSession();


  if(error){

    setLoginStatus(
      'Không thể kiểm tra đăng nhập: '
      + error.message,
      'err'
    );

    $('loginBtn')
      .classList
      .remove('hide');

    return;
  }


  await startApplication(
    data.session
  );

})();
</script>
