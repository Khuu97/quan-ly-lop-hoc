<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUẢN LÍ HỌC SINH – B5.2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;
  --line:#e5e7eb;--blue:#2563eb;--nav:#111827;--nav2:#263247;
  --okbg:#e8f7ed;--ok:#166534;--warnbg:#fff7d6;--warn:#854d0e;
  --errbg:#ffe8e8;--err:#b42318;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,select{font:inherit}button{cursor:pointer}.hide{display:none!important}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 14px #00000008}
.login-card{width:100%;max-width:520px;padding:30px}
.primary{border:0;background:var(--blue);color:#fff;padding:11px 15px;border-radius:9px;font-weight:700}
.ghost{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px}

.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:19px}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.account{display:flex;gap:10px;align-items:center}.mail{font-size:13px;color:var(--muted)}
.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 68px)}
.side{background:var(--nav);padding:14px 12px}
.nav{display:block;width:100%;border:0;background:transparent;color:#e5e7eb;text-align:left;padding:12px 13px;margin:3px 0;border-radius:10px;font-weight:700}
.nav:hover,.nav.active{background:var(--nav2);color:#fff}
.main{padding:22px;min-width:0}
.card{padding:18px;margin-bottom:16px}
.status{padding:11px 13px;border-radius:10px;background:var(--warnbg);color:var(--warn);margin-bottom:14px}
.status.ok{background:var(--okbg);color:var(--ok)}.status.err{background:var(--errbg);color:var(--err)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap}.field{flex:1;min-width:220px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.metric{border:1px solid var(--line);border-radius:12px;padding:15px}
.metric small{color:var(--muted);display:block}.metric b{display:block;font-size:24px;margin-top:6px}
.row{padding:13px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.rowbtn{width:100%;text-align:left;border:0;background:transparent;padding:0;color:inherit}
.rowbtn:hover .name{color:var(--blue)}
.name{font-weight:800;font-size:16px}.meta{color:var(--muted);font-size:13px;margin-top:4px}
.badge{display:inline-block;padding:5px 9px;background:#eff6ff;color:#1d4ed8;border-radius:999px;font-size:12px;font-weight:700}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.back{border:0;background:transparent;color:var(--blue);padding:0;font-weight:700;margin-bottom:14px}
.tx{display:grid;grid-template-columns:95px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}.plus{font-weight:800;color:#15803d}.minus{font-weight:800;color:#b42318}
h2,h3{margin-top:0}

@media(max-width:820px){
 .layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;padding:8px;position:sticky;top:68px;z-index:10}
 .nav{width:auto;min-width:max-content;margin:0 3px}.main{padding:14px}.grid{grid-template-columns:1fr}.mail{display:none}
 .tx{grid-template-columns:75px 1fr}
}
</style>
</head>

<body>

<section id="loginView" class="login-wrap">
 <div class="login-card">
  <h1>QUẢN LÍ HỌC SINH</h1>
  <p style="color:#667085">B5.2 – Context Detail + Point History</p>
  <div id="loginStatus" class="status">Đang kiểm tra đăng nhập…</div>
  <button id="loginBtn" class="primary hide">Đăng nhập bằng Google</button>
 </div>
</section>

<section id="appView" class="hide">
 <header class="top">
  <div><div id="title" class="brand">QUẢN LÍ HỌC SINH</div><div class="sub">B5.2 · Context Detail + Point History</div></div>
  <div class="account"><span id="mail" class="mail"></span><button id="logoutBtn" class="ghost">Đăng xuất</button></div>
 </header>

 <div class="layout">
  <aside id="side" class="side"></aside>

  <main class="main">
   <div id="status" class="status">Đang tải…</div>

   <section class="card">
    <div class="toolbar">
     <div class="field"><label>LỚP / NGỮ CẢNH</label><select id="context"></select></div>
     <div class="field"><label>HỌC KỲ</label><select id="semester"></select></div>
    </div>
   </section>

   <div id="content"></div>
  </main>
 </div>
</section>

<script>
const U='https://woqspbwuqfdzkkiyibcm.supabase.co';
const K='sb_publishable__fH3y7TIDu7vixpRo5DlYQ_sxHKlhZl';
const db=supabase.createClient(U,K);
const $=id=>document.getElementById(id);

const NAV={
 teacher:['Tổng quan','Lớp học','Học sinh','Điểm rèn luyện','BXH','Điểm học tập','EduFlow','Tài khoản HS','Cấu hình'],
 student:['Trang chủ','Hồ sơ','Điểm','BXH','Chức vụ','Nghề nghiệp','Học tập','Kết quả','Trao đổi/Thông báo']
};

const A={
 session:null,role:null,data:null,contexts:[],semesters:[],
 contextId:null,semesterId:null,page:null,selectedStudent:null
};

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function st(t,c=''){$('status').textContent=t;$('status').className='status '+c}
function lst(t,c=''){$('loginStatus').textContent=t;$('loginStatus').className='status '+c}

async function rpc(name,args={}){
 const {data,error}=await db.rpc(name,args);
 if(error)throw error;
 return data;
}

async function login(){
 const {error}=await db.auth.signInWithOAuth({
  provider:'google',
  options:{redirectTo:location.origin+location.pathname}
 });
 if(error)lst(error.message,'err');
}

async function logout(){await db.auth.signOut();location.reload()}

function studentContexts(d){
 const a=[];
 (d.memberships||[]).forEach(m=>(m.contexts||[]).forEach(c=>a.push({
  ...c,membership_id:m.membership_id,class_id:m.class_id,
  class_name:m.class_name,class_code:m.class_code,school_year:m.school_year
 })));
 return a;
}

function teacherContexts(d){
 const a=[];
 (d.classes||[]).forEach(cl=>(cl.contexts||[]).forEach(c=>a.push({
  ...c,class_id:cl.class_id,class_name:cl.class_name,
  class_code:cl.class_code,school_year:cl.school_year
 })));
 return a;
}

function ctxLabel(c){
 return `${c?.class_name||'Lớp'} · ${c?.context_type==='HOMEROOM'?'Chủ nhiệm':'Bộ môn'}${c?.subject_name?' · '+c.subject_name:''}`;
}

function semLabel(s){return `${s?.semester_code||''}${s?.school_year?' · '+s.school_year:''}`}

function currentContext(){return A.contexts.find(x=>String(x.context_id)===String(A.contextId))}
function currentSemester(){return A.semesters.find(x=>String(x.semester_id)===String(A.semesterId))}

async function start(session){
 if(!session){
  $('appView').classList.add('hide');$('loginView').classList.remove('hide');
  $('loginBtn').classList.remove('hide');return lst('Chưa đăng nhập.');
 }

 A.session=session;
 lst('Đã xác thực Google. Đang tải bootstrap…');

 try{
  const b=await rpc('v4_bootstrap_lite');
  const d=b?.data||{};
  A.data=d;
  A.role=String(b?.identity?.role||'').toLowerCase();

  if(!['teacher','student'].includes(A.role))throw Error('Tài khoản chưa có vai trò hợp lệ.');

  A.contexts=A.role==='teacher'?teacherContexts(d):studentContexts(d);
  A.semesters=Array.isArray(d.semesters)?d.semesters:[];
  A.contextId=A.contexts[0]?.context_id??null;

  const active=A.semesters.find(x=>x.is_active)||A.semesters[0];
  A.semesterId=active?.semester_id??null;
  A.page=NAV[A.role][0];

  renderShell();
  await renderPage();
 }catch(e){
  $('appView').classList.add('hide');$('loginView').classList.remove('hide');
  lst('Không thể mở ứng dụng: '+e.message,'err');
 }
}

function renderShell(){
 $('loginView').classList.add('hide');$('appView').classList.remove('hide');
 $('title').textContent=A.role==='teacher'?'QUẢN LÍ HỌC SINH':'CỔNG HỌC SINH';
 $('mail').textContent=A.session.user.email||'';

 $('side').innerHTML=NAV[A.role].map(x=>`<button class="nav ${x===A.page?'active':''}" data-p="${esc(x)}">${esc(x)}</button>`).join('');
 $('side').querySelectorAll('.nav').forEach(b=>b.onclick=async()=>{
  A.page=b.dataset.p;A.selectedStudent=null;renderShell();await renderPage();
 });

 $('context').innerHTML=A.contexts.length
  ?A.contexts.map(c=>`<option value="${c.context_id}" ${String(c.context_id)===String(A.contextId)?'selected':''}>${esc(ctxLabel(c))}</option>`).join('')
  :'<option value="">Chưa có context</option>';

 $('semester').innerHTML=A.semesters.length
  ?A.semesters.map(s=>`<option value="${s.semester_id}" ${String(s.semester_id)===String(A.semesterId)?'selected':''}>${esc(semLabel(s))}</option>`).join('')
  :'<option value="">Chưa có học kỳ</option>';

 $('context').onchange=async e=>{A.contextId=e.target.value;A.selectedStudent=null;await renderPage()};
 $('semester').onchange=async e=>{A.semesterId=e.target.value;A.selectedStudent=null;await renderPage()};
}

async function renderPage(){
 const c=currentContext(),s=currentSemester();

 if(!c||!s){
  $('content').innerHTML='<section class="card empty">Chưa có lớp/ngữ cảnh hoặc học kỳ khả dụng.</section>';
  return st('Bootstrap hoàn tất.','ok');
 }

 st('Đang tải '+A.page+'…');

 try{
  if(A.role==='teacher')await teacherPage(c,s);
  else await studentPage(c,s);
  st(`Đã tải ${A.page} · ${ctxLabel(c)} · ${semLabel(s)}`,'ok');
 }catch(e){
  console.error(e);
  $('content').innerHTML='<section class="card empty">Không thể tải dữ liệu mục này.</section>';
  st(e.message,'err');
 }
}

async function teacherRoster(c,s){
 const x=await rpc('v4_teacher_context_students',{
  p_context_id:c.context_id,p_semester_id:s.semester_id
 });
 return Array.isArray(x)?x:[];
}

function rows(a){
 if(!a.length)return '<div class="empty">Chưa có học sinh.</div>';
 return a.map(r=>`
 <div class="row">
  <button class="rowbtn" data-mid="${esc(r.membership_id)}">
   <div class="name">${esc(r.full_name||r.student_name||'Học sinh')}</div>
   <div class="meta">${esc(r.email||'')}</div>
   <div class="meta">${r.points!==undefined?esc(r.points)+' điểm':''}${r.band!==undefined?' · Band '+esc(r.band):''}</div>
  </button>
 </div>`).join('');
}

async function teacherPage(c,s){
 if(A.selectedStudent){
  await teacherDetail(c,s,A.selectedStudent);
  return;
 }

 if(['Tổng quan','Lớp học','Học sinh'].includes(A.page)){
  const a=await teacherRoster(c,s);

  $('content').innerHTML=`
   <section class="card">
    <h2>${esc(A.page)}</h2>
    <p class="meta">${esc(ctxLabel(c))} · ${esc(semLabel(s))}</p>
    <div class="grid">
     <div class="metric"><small>Học sinh</small><b>${a.length}</b></div>
     <div class="metric"><small>Loại lớp</small><b style="font-size:17px">${c.context_type==='HOMEROOM'?'Lớp chủ nhiệm':'Lớp bộ môn'}</b></div>
     <div class="metric"><small>Học kỳ</small><b>${esc(s.semester_code)}</b></div>
    </div>
   </section>
   <section class="card"><h3>Học sinh trong lớp</h3>${rows(a)}</section>`;

  $('content').querySelectorAll('.rowbtn').forEach(b=>b.onclick=async()=>{
   A.selectedStudent=b.dataset.mid;
   await renderPage();
  });
  return;
 }

 $('content').innerHTML=`<section class="card"><h2>${esc(A.page)}</h2><div class="empty">Module này chưa phát triển trong B5.2.</div></section>`;
}

async function teacherDetail(c,s,membershipId){
 const detail=await rpc('v4_teacher_student_context_detail',{
  p_membership_id:Number(membershipId),
  p_context_id:c.context_id,
  p_semester_id:s.semester_id
 });

 let history=[];
 try{
  history=await rpc('v4_teacher_point_history',{
   p_membership_id:Number(membershipId),
   p_context_id:c.context_id,
   p_semester_id:s.semester_id,
   p_limit:100
  });
 }catch(e){
  console.warn('History:',e);
 }

 history=Array.isArray(history)?history:[];

 $('content').innerHTML=`
 <button id="back" class="back">← Quay lại danh sách học sinh</button>

 <section class="card">
  <h2>${esc(detail?.full_name||detail?.student_name||'Học sinh')}</h2>
  <p class="meta">${esc(detail?.email||'')} · ${esc(ctxLabel(c))} · ${esc(semLabel(s))}</p>

  <div class="grid">
   <div class="metric"><small>Điểm hiện tại</small><b>${esc(detail?.points??0)}</b></div>
   <div class="metric"><small>Band</small><b>${esc(detail?.band??'—')}</b></div>
   <div class="metric"><small>Chức vụ</small><b style="font-size:17px">${esc(detail?.role?.display_name||'Chưa có')}</b></div>
  </div>
 </section>

 <section class="card">
  <h3>Nghề nghiệp</h3>
  <p>${esc(detail?.career?.display_name||'Chưa chọn')}</p>
 </section>

 <section class="card">
  <h3>Lịch sử điểm</h3>
  ${renderHistory(history)}
 </section>`;

 $('back').onclick=async()=>{A.selectedStudent=null;await renderPage()};
}

function renderHistory(a){
 if(!a.length)return '<div class="empty">Chưa có giao dịch điểm trong học kỳ/ngữ cảnh này.</div>';

 return a.map(x=>{
  const d=Number(x.delta||0);
  const sign=d>0?'+'+d:String(d);
  const cls=d>0?'plus':'minus';
  const time=x.created_at?new Date(x.created_at).toLocaleString('vi-VN'):'';

  return `<div class="tx">
   <div class="${cls}">${esc(sign)} điểm</div>
   <div>
    <div><b>${esc(x.reason||'Không có lý do')}</b></div>
    <div class="meta">${esc(time)}${x.is_undo?' · Hoàn tác':''}</div>
   </div>
   <span class="badge">${esc(x.source||'SYSTEM')}</span>
  </div>`;
 }).join('');
}

async function studentSummary(c,s){
 return await rpc('v4_student_context_summary',{
  p_membership_id:c.membership_id,
  p_context_id:c.context_id,
  p_semester_id:s.semester_id
 });
}

async function studentPage(c,s){
 if(!c.membership_id)throw Error('Bootstrap thiếu membership.');

 const x=await studentSummary(c,s);

 if(A.page==='Điểm'){
  let history=await rpc('v4_student_point_history',{
   p_membership_id:c.membership_id,
   p_context_id:c.context_id,
   p_semester_id:s.semester_id,
   p_limit:100
  });
  history=Array.isArray(history)?history:[];

  $('content').innerHTML=`
   <section class="card">
    <h2>Điểm</h2>
    <p class="meta">${esc(ctxLabel(c))} · ${esc(semLabel(s))}</p>
    <div class="grid">
     <div class="metric"><small>Điểm hiện tại</small><b>${esc(x.points??0)}</b></div>
     <div class="metric"><small>Band</small><b>${esc(x.band??'—')}</b></div>
     <div class="metric"><small>Học kỳ</small><b>${esc(s.semester_code)}</b></div>
    </div>
   </section>
   <section class="card"><h3>Lịch sử điểm</h3>${renderHistory(history)}</section>`;
  return;
 }

 if(['Trang chủ','Hồ sơ','Chức vụ','Nghề nghiệp'].includes(A.page)){
  $('content').innerHTML=`
  <section class="card">
   <h2>${esc(A.page)}</h2>
   <p><b>${esc(x.student_name||'Học sinh')}</b></p>
   <p class="meta">${esc(ctxLabel(c))} · ${esc(semLabel(s))}</p>
   <div class="grid">
    <div class="metric"><small>Điểm hiện tại</small><b>${esc(x.points??0)}</b></div>
    <div class="metric"><small>Band</small><b>${esc(x.band??'—')}</b></div>
    <div class="metric"><small>Chức vụ</small><b style="font-size:17px">${esc(x.role?.display_name||'Chưa có')}</b></div>
   </div>
  </section>
  <section class="card"><h3>Nghề nghiệp</h3><p>${esc(x.career?.display_name||'Chưa chọn')}</p></section>`;
  return;
 }

 $('content').innerHTML=`<section class="card"><h2>${esc(A.page)}</h2><div class="empty">Module này chưa phát triển trong B5.2.</div></section>`;
}

$('loginBtn').onclick=login;
$('logoutBtn').onclick=logout;

db.auth.onAuthStateChange((e,s)=>{
 if(e==='SIGNED_IN'||e==='SIGNED_OUT')start(s);
});

(async()=>{
 const {data,error}=await db.auth.getSession();
 if(error){
  lst('Không thể kiểm tra phiên: '+error.message,'err');
  $('loginBtn').classList.remove('hide');
  return;
 }
 await start(data.session);
})();
</script>
</body>
</html>
