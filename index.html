<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lí lớp học V0.3</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f4f7fb;margin:0;color:#172033}.w{max-width:900px;margin:auto;padding:24px}.c{background:#fff;padding:22px;border-radius:16px;margin:15px 0;box-shadow:0 5px 25px #0001}.hide{display:none}.s{padding:10px;background:#fff4cc;border-radius:9px}.ok{background:#e5f7eb}.err{background:#ffe7e7}button{padding:11px 15px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.stu{border:1px solid #ddd;padding:14px;border-radius:12px;margin:10px 0}.pts{font-size:28px;font-weight:bold}select{padding:9px;width:100%;margin-top:8px}</style></head><body><div class="w"><div class="c"><h1>QUẢN LÍ LỚP HỌC</h1><p>V0.3 – Google Login + Role Router</p><div id="st" class="s">Đang kiểm tra đăng nhập…</div><div id="login" class="hide"><p>Đăng nhập bằng Google đã được cấp quyền.</p><button onclick="login()">Đăng nhập bằng Google</button></div><div id="user" class="hide"><p><b id="mail"></b> <button onclick="logout()">Đăng xuất</button></p></div></div><div id="teacher" class="c hide"><h2>CỔNG GIÁO VIÊN</h2><div id="list"></div></div><div id="student" class="c hide"><h2>CỔNG HỌC SINH</h2><div id="sv"></div></div><div id="deny" class="c hide"><h2>Chưa được cấp quyền</h2><p>Email này chưa có vai trò hợp lệ trong hệ thống.</p></div></div><script>
const U='https://woqspbwuqfdzkkiyibcm.supabase.co',K='sb_publishable__fH3y7TIDu7vixpRo5DlYQ_sxHKlhZl',db=supabase.createClient(U,K);
const $=x=>document.getElementById(x);let role=null,me=null,stu=null,ch=null;
function sh(x,v=1){$(x).classList.toggle('hide',!v)}function status(x,c=''){$('st').textContent=x;$('st').className='s '+c}
async function login(){const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)status(error.message,'err')}
async function logout(){await db.auth.signOut();location.reload()}
async function route(session){['login','user','teacher','student','deny'].forEach(x=>sh(x,0));if(!session){sh('login');return status('Chưa đăng nhập.')}me=session.user;$('mail').textContent=me.email;sh('user');let email=(me.email||'').toLowerCase();status('Đã xác thực Google. Đang xác định vai trò…');let {data:r,error}=await db.from('user_roles').select('role').eq('email',email).maybeSingle();if(error)return status('Lỗi đọc vai trò: '+error.message,'err');role=r?.role;if(role==='teacher'){sh('teacher');status('Đăng nhập thành công → CỔNG GIÁO VIÊN','ok');await loadT()}else if(role==='student'){let q=await db.from('students').select('*').eq('email',email).maybeSingle();if(q.error||!q.data){sh('deny');return status('Không tìm thấy hồ sơ học sinh.','err')}stu=q.data;sh('student');renderS();status('Đăng nhập thành công → CỔNG HỌC SINH','ok')}else{sh('deny');status('Email chưa được cấp quyền.','err')}rt()}
async function loadT(){let {data,error}=await db.from('students').select('*').order('id');if(error)return status(error.message,'err');$('list').innerHTML=data.map(s=>`<div class="stu"><b>${s.full_name}</b><div>${s.email||''}</div><div class="pts">${s.points||0} điểm</div><div>Chức vụ: <b>${s.selected_role||'Chưa chọn'}</b></div><div class="row"><button onclick="points(${s.id},4)">+4</button><button onclick="points(${s.id},-2)">−2</button></div></div>`).join('')}
async function points(id,d){let a=await db.from('students').select('points').eq('id',id).single();if(a.error)return status(a.error.message,'err');let e=await db.from('students').update({points:Number(a.data.points||0)+d}).eq('id',id);if(e.error)return status(e.error.message,'err');await loadT()}
function renderS(){let opts=['Học sĩ','Hiệp sĩ','Tướng quân'];$('sv').innerHTML=`<div class="stu"><b>${stu.full_name}</b><div>${stu.email}</div><div class="pts">${stu.points||0} điểm</div><select id="rs"><option value="">Chưa chọn</option>${opts.map(x=>`<option ${stu.selected_role===x?'selected':''}>${x}</option>`).join('')}</select><p>Đã chọn: <b>${stu.selected_role||'Chưa chọn'}</b></p></div>`;$('rs').onchange=saveRole}
async function saveRole(e){let el=e.target,w=el.value,o=stu.selected_role||'';el.value=o;el.disabled=true;let q=await db.from('students').update({selected_role:w||null}).eq('id',stu.id).select('*').single();if(q.error){status(q.error.message,'err');renderS();return}stu=q.data;renderS();status('Chức vụ đã được database xác nhận.','ok')}
function rt(){if(ch)db.removeChannel(ch);ch=db.channel('v03-'+Math.random()).on('postgres_changes',{event:'UPDATE',schema:'public',table:'students'},async p=>{if(role==='teacher')await loadT();if(role==='student'&&p.new.id===stu?.id){stu=p.new;renderS()}}).subscribe()}
db.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_IN'||e==='SIGNED_OUT')route(s)});(async()=>{let {data}=await db.auth.getSession();route(data.session)})();
</script></body></html>
